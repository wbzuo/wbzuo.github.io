<link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
<link rel="manifest" href="images/site.webmanifest">

<meta name="msapplication-TileColor" content="#000000">
<meta name="msapplication-TileImage" content="images/mstile-144x144.png?v=M44lzPylqQ">
<meta name="msapplication-config" content="images/browserconfig.xml?v=M44lzPylqQ">
<meta name="theme-color" content="#ffffff">

<!-- ===== SEO: meta + Open Graph + Twitter + JSON-LD (academic Person) ===== -->
<meta name="description" content="{{ site.description }}">
<meta name="author" content="{{ site.author.name }}">
<meta name="keywords" content="Wenbin Zuo, 左文彬, Tongji University, 同济大学, visual perception, neuro-symbolic computing, human-computer interaction, PhD student, artificial intelligence">
{% if site.search_indexing %}
<meta name="robots" content="index, follow">
{% else %}
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
{% endif %}
<meta property="og:type" content="profile">
{% if site.og_image %}<meta property="og:image" content="{{ site.og_image | prepend: site.url }}">{% endif %}
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{ site.title }}">
<meta name="twitter:description" content="{{ site.description }}">
{% if site.og_image %}<meta name="twitter:image" content="{{ site.og_image | prepend: site.url }}">{% endif %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "Wenbin Zuo",
  "alternateName": "左文彬",
  "url": "{{ site.url }}/",
  {% if site.og_image %}"image": "{{ site.og_image | prepend: site.url }}",{% endif %}
  "jobTitle": "PhD Student",
  "affiliation": {"@type": "CollegeOrUniversity", "name": "Tongji University"},
  "alumniOf": {"@type": "CollegeOrUniversity", "name": "Jiangxi University of Finance and Economics"},
  "knowsAbout": ["Visual Perception", "Neuro-Symbolic Computing", "Human-Computer Interaction"],
  "sameAs": [
    "https://github.com/{{ site.author.github }}"{% if site.author.googlescholar != blank and site.author.googlescholar != "#" %},
    "{{ site.author.googlescholar }}"{% endif %}{% if site.author.orcid != blank and site.author.orcid != "#" %},
    "{{ site.author.orcid }}"{% endif %}{% if site.author.dblp != blank and site.author.dblp != "#" %},
    "{{ site.author.dblp }}"{% endif %}{% if site.author.semanticscholar != blank and site.author.semanticscholar != "#" %},
    "{{ site.author.semanticscholar }}"{% endif %}
  ]
}
</script>
<!-- ===== end SEO ===== -->

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/academicons@1.9.5/css/academicons.min.css"/>
