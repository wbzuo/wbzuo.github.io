short_bio: >-
  <p>
    I am Wenbin Zuo, a first-year PhD student in Intelligent Science and Technology at
    <a href="https://www.tongji.edu.cn/" target="_blank">Tongji University</a>, Shanghai, China.
    I received my B.S. in Software Engineering from
    <a href="https://www.jxufe.edu.cn/" target="_blank">Jiangxi University of Finance and Economics</a> in 2025.
  </p>
  <p>
    I am broadly interested in <strong>visual perception</strong> and <strong>visual reasoning</strong> — how a
    vision system can move past recognising what is in a scene toward inferring how its parts relate.
    I am currently reading and building in this area while narrowing down a specific direction.
  </p>

