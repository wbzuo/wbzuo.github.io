short_bio_text_justify: false
short_bio: >-
  <p>
    I am Wenbin Zuo (左文彬), a PhD student in Intelligent Science and Technology at
    <a href="https://www.tongji.edu.cn/" target="_blank">Tongji University</a>, Shanghai, China,
    advised by <a href="https://faculty.tongji.edu.cn/guoweiwei/zh_CN/index.htm" target="_blank">Prof. Weiwei Guo (郭炜炜)</a>,
    as a member of the LV Group. I received my B.S. in Software Engineering from
    <a href="https://www.jxufe.edu.cn/" target="_blank">Jiangxi University of Finance and Economics</a> in 2025.
  </p>
  <p>
    My research interests span <strong>visual perception</strong>, <strong>neuro-symbolic computing</strong>,
    and <strong>human–computer interaction</strong>, among related directions. I am broadly interested in
    intelligent systems that can perceive, reason, and interact with the world — in particular, how
    task-level symbolic reasoning can be grounded in perception that is noisy, costly and fallible.
  </p>
  <p class="text-muted">
    我是左文彬，<a href="https://www.tongji.edu.cn/" target="_blank">同济大学</a>智能科学与技术专业在读博士生，
    导师为 <a href="https://faculty.tongji.edu.cn/guoweiwei/zh_CN/index.htm" target="_blank">郭炜炜</a> 教授（LV Group）。
    2025 年本科毕业于 <a href="https://www.jxufe.edu.cn/" target="_blank">江西财经大学</a>软件工程专业。
    研究方向主要包括视觉感知、神经符号计算与人机交互等。如有学术合作意向，欢迎邮件联系。
  </p>

