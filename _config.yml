# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve`. If you change this file, please restart the server process.

# Site Settings
search_indexing          : false # Set to true when the site is ready to appear in search results.
title                    : "Wenbin Zuo | Tongji University"
description              : "Wenbin Zuo is a PhD student in Intelligent Science and Technology at Tongji University, working on visual perception, neuro-symbolic computing, and human-computer interaction."
og_image                 : "/images/android-chrome-512x512.png"
repository               : "wbzuo/wbzuo.github.io"
url                      : "https://wbzuo.github.io"   # absolute base — needed for canonical / og / sitemap / JSON-LD
baseurl                  : ""
locale                   : "en_US"
# google_site_verification : "PASTE_CODE_HERE"   # from Google Search Console (Settings → Ownership) to verify the site
google_scholar_stats_use_cdn : true

# google analytics
google_analytics_id      :  # get google_analytics_id from https://analytics.google.com/analytics/

# Site Author
author:
  name             : "Wenbin Zuo (左文彬)"
  avatar           : "images/android-chrome-512x512.png"
  bio              : "PhD Student in Intelligent Science and Technology"
  location         : "Shanghai, China"
  employer         : "Tongji University"
  cv               : ""
  email            : "wbzuo@tongji.edu.cn"
  github           : "wbzuo"
  twitter          : ""
  linkedin         : ""
  # Academic links — "#" are placeholders; replace with your real URLs.
  # An empty string ("") hides that link entirely.
  googlescholar    : "#"            # e.g. https://scholar.google.com/citations?user=YOUR_ID
  orcid            : "#"            # e.g. https://orcid.org/0000-0000-0000-0000
  semanticscholar  : "#"            # e.g. https://www.semanticscholar.org/author/XXX
  dblp             : "#"            # e.g. https://dblp.org/pid/XXX/YYY.html
  arxiv            : "#"            # e.g. https://arxiv.org/a/lastname_f_1
  researchgate     : "#"            # e.g. https://www.researchgate.net/profile/Your-Name
  acm              : "#"            # e.g. https://dl.acm.org/profile/XXX
  publons          : "#"            # Web of Science, e.g. https://www.webofscience.com/wos/author/record/XXX

# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - google_scholar_crawler
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-assets-cache
  - README.md
  - GEMINI.md
  - docs
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Defaults
defaults:
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      author_profile: true

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache
