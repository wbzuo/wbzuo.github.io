# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve`. If you change this file, please restart the server process.

# Site Settings
title                    : "AcadHomepage | Template"
description              : "A modern, card-based academic personal homepage template for researchers."
og_image                 : "/images/favicon.ico"
repository               : "username/repository"
google_scholar_stats_use_cdn : true

# Site Author
author:
  name             : "Your Name"
  avatar           : "images/favicon.ico"
  bio              : "Your Title @ Your University"
  location         : "City, Country"
  employer         : "Your Institution"
  googlescholar    : "https://scholar.google.com/citations?user=YOUR_ID"
  cv               : "assets/files/your_cv.pdf"
  email            : "your_email@example.com"
  github           : "your_username"
  twitter          : ""
  linkedin         : ""
  orcid            : ""

# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - google_scholar_crawler
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-assets-cache
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Defaults
defaults:
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      author_profile: true

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache
