# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve`. If you change this file, please restart the server process.

# Site Settings
title                    : "Wenbin Zuo | Tongji University"
description              : "Wenbin Zuo is a PhD student at Tongji University, focusing on LLMs for Software Engineering and Intelligent Software Analysis."
og_image                 : "/images/android-chrome-512x512.png"
repository               : "wbzuo/wbzuo.github.io"
google_scholar_stats_use_cdn : true

# google analytics
google_analytics_id      :  # get google_analytics_id from https://analytics.google.com/analytics/

# Site Author
author:
  name             : "Wenbin Zuo"
  avatar           : "images/android-chrome-512x512.png"
  bio              : "PhD Student @ Tongji University"
  location         : "Shanghai, China"
  employer         : "Tongji University"
  googlescholar    : ""
  cv               : ""
  email            : "wbzuo@tongji.edu.cn"
  github           : "wbzuo"
  twitter          : ""
  linkedin         : ""
  orcid            : ""             # e.g. https://orcid.org/0000-0000-0000-0000
  dblp             : ""             # e.g. https://dblp.org/pid/XXX/YYY.html
  semanticscholar  : ""             # e.g. https://www.semanticscholar.org/author/XXX
  arxiv            : ""             # e.g. https://arxiv.org/a/lastname_f_1
  researchgate     : ""             # e.g. https://www.researchgate.net/profile/Your-Name

# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - google_scholar_crawler
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-assets-cache
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Defaults
defaults:
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      author_profile: true

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache
